[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "family-kb-ai"
version = "0.1.0"
description = "Local vector search over an external Markdown family knowledge base."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "qdrant-client>=1.10,<2",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
family-kb = "family_kb_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
